---
- name: Ensure backbone keypair exists
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    if [ ! -f "{{ dromos_secrets_dir }}/backbone.key" ]; then
      wg genkey | tee "{{ dromos_secrets_dir }}/backbone.key" \
        | wg pubkey > "{{ dromos_secrets_dir }}/backbone.pub"
    fi
  args:
    executable: /bin/bash
    creates: "{{ dromos_secrets_dir }}/backbone.pub"

- name: Slurp backbone private key
  ansible.builtin.slurp:
    src: "{{ dromos_secrets_dir }}/backbone.key"
  register: _backbone_key

- name: Set fact for backbone private key
  ansible.builtin.set_fact:
    dromos_backbone_peleon_private_key: "{{ _backbone_key.content | b64decode | trim }}"

# Resolve Phebes' backbone public key. Order of preference:
#   1. an explicit inventory / -e override (dromos_phebes_backbone_public_key)
#   2. the fact published by bootstrap.yml on the Phebes host (site.yml run)
# This lets `site.yml` work on a clean install while a standalone `peleon.yml`
# run still works when the operator passes the key in.
#
# Guard on a *non-empty* value, not merely `is defined`: bootstrap publishes the
# fact from backbone.pub, and a fresh/empty/truncated file yields an empty
# string that is technically "defined". Resolving that empty value would render
# `PublicKey =` and make wg-quick fail with "Line unrecognized: PublicKey=".
- name: Resolve Phebes backbone public key
  ansible.builtin.set_fact:
    dromos_phebes_backbone_public_key: >-
      {{ dromos_phebes_backbone_public_key
         if (dromos_phebes_backbone_public_key | default('') | trim) | length > 0
         else hostvars[groups['phebes'][0]].dromos_backbone_public_key | default('') | trim }}
  when: >-
    (dromos_phebes_backbone_public_key | default('') | trim) | length > 0
    or (groups['phebes'] is defined
        and groups['phebes'] | length > 0
        and (hostvars[groups['phebes'][0]].dromos_backbone_public_key | default('') | trim) | length > 0)

# Fail early, before any template renders, if the key is missing OR present but
# not a valid WireGuard public key (44-char base64: 43 chars + '=' pad).
- name: Validate Phebes backbone public key
  ansible.builtin.assert:
    that:
      - (dromos_phebes_backbone_public_key | default('') | trim) is match('^[A-Za-z0-9+/]{43}=$')
    fail_msg: >-
      dromos_phebes_backbone_public_key is missing or not a valid WireGuard
      public key (got: '{{ dromos_phebes_backbone_public_key | default('') }}').
      Run the full site.yml (which bootstraps and exchanges both backbone public
      keys automatically), or pass it explicitly:
      -e dromos_phebes_backbone_public_key=<phebes backbone.pub>.
      See README "Clean install".
    quiet: true

# Open the backbone UDP port in UFW *before* the WG unit starts, so a live host
# running `default deny incoming` (only 22/tcp allowed) still completes the
# Phebes<->Peleon handshake. Peleon only needs its backbone listen port.
- name: Allow required ports through UFW (Peleon)
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/firewall.yml"
  vars:
    dromos_firewall_udp_ports:
      - "{{ dromos_backbone_listen_port_peleon | default(51821) }}"

- name: Render backbone WG config (Peleon side)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../templates/wireguard/dromos-backbone-peleon.conf.j2"
    dest: /etc/wireguard/dromos-backbone.conf
    owner: root
    group: root
    mode: "0600"
  notify: reload dromos-backbone

- name: Render Peleon nftables ruleset
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../templates/nftables/dromos.nft.j2"
    dest: "{{ dromos_config_dir }}/dromos.nft"
    owner: root
    group: root
    mode: "0640"
  notify: reload dromos-nft

- name: Install dromos-nft systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/dromos-nft.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Dromos nftables (isolated table inet dromos)
      Before=wg-quick@dromos-backbone.service
      After=network-pre.target
      [Service]
      Type=oneshot
      RemainAfterExit=true
      ExecStart=/usr/sbin/nft -f {{ dromos_config_dir }}/dromos.nft
      ExecReload=/usr/sbin/nft -f {{ dromos_config_dir }}/dromos.nft
      ExecStop=/usr/sbin/nft delete table inet dromos
      [Install]
      WantedBy=multi-user.target
  notify: reload systemd

- name: Enable Dromos services on Peleon
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - dromos-nft.service
    - wg-quick@dromos-backbone.service
