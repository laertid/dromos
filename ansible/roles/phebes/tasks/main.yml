---
- name: Install Phebes-specific packages
  ansible.builtin.apt:
    name:
      - shadowsocks-libev
      - openvpn
      - easy-rsa
      - dnsmasq
    state: present

- name: Ensure server keypair exists
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    if [ ! -f "{{ dromos_secrets_dir }}/server.key" ]; then
      wg genkey | tee "{{ dromos_secrets_dir }}/server.key" \
        | wg pubkey > "{{ dromos_secrets_dir }}/server.pub"
    fi
    if [ ! -f "{{ dromos_secrets_dir }}/backbone.key" ]; then
      wg genkey | tee "{{ dromos_secrets_dir }}/backbone.key" \
        | wg pubkey > "{{ dromos_secrets_dir }}/backbone.pub"
    fi
  args:
    executable: /bin/bash
    creates: "{{ dromos_secrets_dir }}/server.pub"

- name: Slurp server private key
  ansible.builtin.slurp:
    src: "{{ dromos_secrets_dir }}/server.key"
  register: _server_key

- name: Slurp backbone private key
  ansible.builtin.slurp:
    src: "{{ dromos_secrets_dir }}/backbone.key"
  register: _backbone_key

- name: Set fact for server private key
  ansible.builtin.set_fact:
    dromos_server_private_key: "{{ _server_key.content | b64decode | trim }}"
    dromos_backbone_phebes_private_key: "{{ _backbone_key.content | b64decode | trim }}"

- name: Load existing user list
  ansible.builtin.slurp:
    src: "{{ dromos_config_dir }}/users.json"
  register: _users_json
  ignore_errors: true

- name: Set fact for users
  ansible.builtin.set_fact:
    dromos_users: "{{ (_users_json.content | b64decode | from_json).users | default([]) if _users_json is succeeded else [] }}"

- name: Render client-facing WireGuard config
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../templates/wireguard/dromos-client.conf.j2"
    dest: /etc/wireguard/dromos-client.conf
    owner: root
    group: root
    mode: "0600"
  notify: reload dromos-client

# Resolve Peleon's backbone public key. Order of preference:
#   1. an explicit inventory / -e override (dromos_peleon_public_key)
#   2. the fact published by bootstrap.yml on the Peleon host (site.yml run)
# This lets `site.yml` work on a clean install while a standalone `phebes.yml`
# run still works when the operator passes the key in.
#
# Guard on a *non-empty* value, not merely `is defined`: bootstrap publishes the
# fact from backbone.pub, and a fresh/empty/truncated file yields an empty
# string that is technically "defined". Resolving that empty value would render
# `PublicKey =` and make wg-quick fail with "Line unrecognized: PublicKey=".
- name: Resolve Peleon backbone public key
  ansible.builtin.set_fact:
    dromos_peleon_public_key: >-
      {{ dromos_peleon_public_key
         if (dromos_peleon_public_key | default('') | trim) | length > 0
         else hostvars[groups['peleon'][0]].dromos_backbone_public_key | default('') | trim }}
  when: >-
    (dromos_peleon_public_key | default('') | trim) | length > 0
    or (groups['peleon'] is defined
        and groups['peleon'] | length > 0
        and (hostvars[groups['peleon'][0]].dromos_backbone_public_key | default('') | trim) | length > 0)

# Fail early, before any template renders, if the key is missing OR present but
# not a valid WireGuard public key (44-char base64: 43 chars + '=' pad).
- name: Validate Peleon backbone public key
  ansible.builtin.assert:
    that:
      - (dromos_peleon_public_key | default('') | trim) is match('^[A-Za-z0-9+/]{43}=$')
    fail_msg: >-
      dromos_peleon_public_key is missing or not a valid WireGuard public key
      (got: '{{ dromos_peleon_public_key | default('') }}'). Run the full
      site.yml (which bootstraps and exchanges both backbone public keys
      automatically), or pass it explicitly:
      -e dromos_peleon_public_key=<peleon backbone.pub>.
      See README "Clean install".
    quiet: true

- name: Render backbone WireGuard config (Phebes side)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../templates/wireguard/dromos-backbone-phebes.conf.j2"
    dest: /etc/wireguard/dromos-backbone.conf
    owner: root
    group: root
    mode: "0600"
  notify: reload dromos-backbone

- name: Render nftables ruleset
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../templates/nftables/dromos.nft.j2"
    dest: "{{ dromos_config_dir }}/dromos.nft"
    owner: root
    group: root
    mode: "0640"
  notify: reload dromos-nft

- name: Install dromos-nft systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/dromos-nft.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Dromos nftables (isolated table inet dromos)
      Before=wg-quick@dromos-client.service wg-quick@dromos-backbone.service
      After=network-pre.target
      [Service]
      Type=oneshot
      RemainAfterExit=true
      ExecStart=/usr/sbin/nft -f {{ dromos_config_dir }}/dromos.nft
      ExecReload=/usr/sbin/nft -f {{ dromos_config_dir }}/dromos.nft
      ExecStop=/usr/sbin/nft delete table inet dromos
      [Install]
      WantedBy=multi-user.target
  notify: reload systemd

# --- SSH-lockout deadman ----------------------------------------------------
# Starting the Dromos WG/nft units is the one moment a deploy can sever the
# operator's SSH session (see docs/troubleshooting.md "I locked myself out").
# Before touching them we arm a transient timer that tears Dromos back down
# unless the deploy reaches the "disarm" task below. If the box becomes
# unreachable mid-deploy, the timer fires and restores SSH on its own.
- name: Arm SSH-lockout deadman (auto-rollback if deploy loses the host)
  ansible.builtin.command:
    cmd: >-
      systemd-run --on-active={{ dromos_deadman_minutes | default(5) }}min
      --unit=dromos-deadman --collect
      /bin/sh -c 'systemctl stop wg-quick@dromos-client wg-quick@dromos-backbone dromos-nft.service;
                  /usr/local/sbin/dromos-routing teardown client;
                  /usr/local/sbin/dromos-routing teardown backbone'
  changed_when: true
  when: dromos_deadman_enabled | default(true) | bool

- name: Enable Dromos units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - dromos-nft.service
    - wg-quick@dromos-backbone.service
    - wg-quick@dromos-client.service

# If we got here, this Ansible task ran -> the control connection survived the
# unit restart -> SSH is fine. Cancel the rollback.
- name: Disarm SSH-lockout deadman (SSH survived the unit restart)
  ansible.builtin.command:
    cmd: systemctl stop dromos-deadman.timer dromos-deadman.service
  changed_when: true
  failed_when: false
  when: dromos_deadman_enabled | default(true) | bool

- name: Install geo-update script + timer
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/dromos-geo-update"
    dest: /usr/local/sbin/dromos-geo-update
    owner: root
    group: root
    mode: "0755"

- name: Install dromos-user CLI
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/dromos-user"
    dest: /usr/local/sbin/dromos-user
    owner: root
    group: root
    mode: "0755"

- name: Install geo timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/dromos-geo-update.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly Dromos geobase refresh
      [Timer]
      OnCalendar=Sun *-*-* 03:17:00
      Persistent=true
      RandomizedDelaySec=15m
      [Install]
      WantedBy=timers.target

- name: Install geo update service
  ansible.builtin.copy:
    dest: /etc/systemd/system/dromos-geo-update.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Refresh Dromos RU geobase
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/dromos-geo-update

- name: Enable geo timer
  ansible.builtin.systemd:
    name: dromos-geo-update.timer
    enabled: true
    state: started
    daemon_reload: true
