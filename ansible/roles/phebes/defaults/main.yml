---
dromos_client_subnet_v4: 10.66.0.0/24
# Client-facing server (gateway) address for the dromos-client interface. This
# MUST be a usable host inside dromos_client_subnet_v4, not the network address
# (rendering 10.66.0.0/24 as the iface Address is wrong -- it is unreachable).
# Keep the subnet's prefix length so the iface is a /24, not a /32. dromos-user
# reserves this .1 for the server and allocates .2+ to clients. If you change
# dromos_client_subnet_v4, change this to match (first host of that subnet).
dromos_client_gateway_v4: 10.66.0.1/24
dromos_client_ifname: dromos-client
dromos_backbone_ifname: dromos-backbone
# Egress (NAT) interface. Defaults to the host's auto-detected default-route
# interface from Ansible facts, so it is correct per host (e.g. enx5 on one box,
# eth0 on another). Override per host or globally in inventory only when the
# auto-detected interface is wrong.
dromos_egress_ifname: "{{ ansible_default_ipv4.interface | default('eth0') }}"
dromos_client_listen_port: 51820
dromos_backbone_listen_port_phebes: 51821
dromos_mark_ru: "0x42"
dromos_mark_foreign: "0x43"
# SSH ingress port to protect from Dromos marking/policy routing. Set this if
# sshd listens on a non-standard port.
dromos_ssh_port: 22
# Deploy-time SSH-lockout safety net. Before the WG/nft units are (re)started,
# a transient systemd timer is armed to tear Dromos back down after
# dromos_deadman_minutes; it is cancelled once the deploy proves SSH survived.
# If the host goes unreachable mid-deploy, the rollback fires automatically.
dromos_deadman_enabled: true
dromos_deadman_minutes: 5
dromos_table_ru: 100
dromos_table_foreign: 101
dromos_client_mtu: 1380
dromos_client_dns: 10.66.0.1
dromos_ss_port: 8388
dromos_ss_method: chacha20-ietf-poly1305
dromos_geo_url: https://www.ipdeny.com/ipblocks/data/aggregated/ru-aggregated.zone
