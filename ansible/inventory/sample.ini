; Sample inventory.  Copy to prod.ini and edit.  prod.ini is gitignored.
; Host names differ from group names on purpose: Ansible warns when a host
; and a group share a name. Playbooks target the groups (hosts: phebes),
; which still resolve to these hosts via the group membership below.
[phebes]
phebes-1 ansible_host=PHEBES.PUBLIC.IP ansible_user=root

[peleon]
peleon-1 ansible_host=PELEON.PUBLIC.IP ansible_user=root

[dromos:children]
phebes
peleon

[dromos:vars]
; -- network ----------------------------------------------------------------
dromos_client_subnet_v4 = 10.66.0.0/24
; Client-facing server (gateway) address. MUST be a usable host in the subnet
; above (the first host), NOT the network address. Defaults to 10.66.0.1/24;
; if you change dromos_client_subnet_v4, set this to its first host.
dromos_client_gateway_v4 = 10.66.0.1/24
dromos_client_ifname    = dromos-client
dromos_backbone_ifname  = dromos-backbone
; Egress (NAT) interface. Leave UNSET to auto-detect each host's default-route
; interface from Ansible facts (ansible_default_ipv4.interface). Only set it --
; per host under [phebes]/[peleon] or globally here -- if auto-detection is
; wrong. Do NOT hardcode eth0 here: live hosts vary (e.g. enx5).
; phebes-1 dromos_egress_ifname=eth0
; peleon-1 dromos_egress_ifname=enx5
dromos_client_listen_port           = 51820
dromos_backbone_listen_port_phebes  = 51821
dromos_backbone_listen_port_peleon  = 51821
dromos_mark_ru      = 0x42
dromos_mark_foreign = 0x43
dromos_table_ru      = 100
dromos_table_foreign = 101

; -- public endpoints -------------------------------------------------------
dromos_phebes_endpoint = vpn.example.ru
dromos_peleon_host     = PELEON.PUBLIC.IP

; -- client DNS -------------------------------------------------------------
; DNS handed to clients. Phebes runs NO resolver, so do NOT point this at the
; tunnel gateway (10.66.0.1) -- lookups would fail. Public resolvers route
; through the full tunnel like any other foreign traffic. Comma-separated list
; is fine. After changing this, existing users must regenerate or hand-edit
; their configs (re-run `dromos-user show <name>` to fetch the updated config).
dromos_client_dns = 1.1.1.1, 1.0.0.1

; -- geo --------------------------------------------------------------------
dromos_geo_url = https://www.ipdeny.com/ipblocks/data/aggregated/ru-aggregated.zone
