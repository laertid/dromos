[defaults]
# Run playbooks from the repo root, e.g.:
#   ansible-playbook -i ansible/inventory/prod.ini ansible/playbooks/phebes.yml
#
# Roles live in ansible/roles, not next to the playbooks, so point
# roles_path there explicitly. Paths are resolved relative to this file
# (the repo root), so this works regardless of the playbook location.
roles_path = ansible/roles
